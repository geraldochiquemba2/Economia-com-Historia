<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="coinGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8B4B8;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4A0A6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A0310;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="innerGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#5A0520;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3A0310;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Outer coin circle -->
  <circle cx="256" cy="256" r="240" fill="url(#coinGradient)" filter="url(#shadow)"/>
  
  <!-- Inner circle border -->
  <circle cx="256" cy="256" r="210" fill="none" stroke="#E8B4B8" stroke-width="4" opacity="0.6"/>
  
  <!-- Inner circle -->
  <circle cx="256" cy="256" r="200" fill="url(#innerGradient)"/>
  
  <!-- Decorative ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#E8B4B8" stroke-width="2" opacity="0.3"/>
  
  <!-- Dollar sign $ -->
  <text x="256" y="280" text-anchor="middle" font-family="Georgia, serif" font-size="160" font-weight="bold" fill="#E8B4B8" opacity="0.9">$</text>
  
  <!-- Small decorative dots around the coin -->
  <circle cx="256" cy="40" r="6" fill="#E8B4B8" opacity="0.5"/>
  <circle cx="256" cy="472" r="6" fill="#E8B4B8" opacity="0.5"/>
  <circle cx="40" cy="256" r="6" fill="#E8B4B8" opacity="0.5"/>
  <circle cx="472" cy="256" r="6" fill="#E8B4B8" opacity="0.5"/>
  
  <circle cx="85" cy="85" r="4" fill="#E8B4B8" opacity="0.4"/>
  <circle cx="427" cy="85" r="4" fill="#E8B4B8" opacity="0.4"/>
  <circle cx="85" cy="427" r="4" fill="#E8B4B8" opacity="0.4"/>
  <circle cx="427" cy="427" r="4" fill="#E8B4B8" opacity="0.4"/>
</svg>
